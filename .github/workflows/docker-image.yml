name: build and publish

# Builds the cs2-modded-server image and publishes it to ghcr.
#
# Fork changes vs upstream (keep when merging upstream's copy of this file):
#   - also builds the 'mine' branch (where the InvisiblePlugin deployment
#     artifact and the skin-changer removal live — an image built from
#     upstream's master would NOT contain the plugin)
#   - tag pushes produce version tags; 'latest' follows 'mine'
on:
  push:
    branches: [master, mine]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to ghcr.io
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # branch name tag: :master / :mine
            type=ref,event=branch
            # git tag verbatim: :v1.2.3
            type=ref,event=tag
            # semver helpers on vX.Y.Z tags: :1.2.3, :1.2, :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest tracks the deployment branch ('mine')
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/mine' }}
          labels: |
            org.opencontainers.image.description=CS2 modded server (k0valik fork: InvisiblePlugin included, skin changer removed)
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
